name: Build NX1-Reborn Executables

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Fix Broken Thirdparty Submodules
      run: |
        Remove-Item -Recurse -Force XenosRecomp\thirdparty -ErrorAction SilentlyContinue
        git clone --recursive https://github.com/hedge-dev/XenosRecomp.git TempXenos
        Copy-Item -Path "TempXenos\thirdparty" -Destination "XenosRecomp\thirdparty" -Recurse -Force

    - name: Build XenosRecomp Tool
      run: |
        cd XenosRecomp
        cmake -B build -G Ninja
        cmake --build build --config Release

    - name: Build Singleplayer Engine (nx1_sp)
      run: |
        cd nx1_sp
        cmake -B build -G Ninja
        cmake --build build --config Release

    - name: Build Multiplayer Engine (nx1_mp)
      run: |
        cd nx1_mp
        cmake -B build -G Ninja
        cmake --build build --config Release

    - name: Upload Compiled Executables
      uses: actions/upload-artifact@v4
      with:
        name: NX1-Compiled-Binaries
        path: |
          XenosRecomp/build/Release/*.exe
          XenosRecomp/build/*.exe
          nx1_sp/build/Release/*.exe
          nx1_sp/build/*.exe
          nx1_mp/build/Release/*.exe
          nx1_mp/build/*.exe

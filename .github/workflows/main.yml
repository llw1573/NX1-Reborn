name: Test Local Runner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Test runner
        shell: pwsh
        run: |
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, OSArchitecture
          Get-PSDrive C

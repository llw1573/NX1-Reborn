name: Build NX1-Reborn Locally

on:
  workflow_dispatch:
    inputs:
      nx1_root:
        description: '本机 NX1 输入目录，目录内应直接包含 1-nx1sp.xex 和 5-nx1mp_demo.xex'
        required: true
        default: 'C:\NX1-private\nx1'

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, windows, x64]

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          clean: true

      - name: Stage Local NX1 Input
        env:
          NX1_ROOT: ${{ inputs.nx1_root }}
        run: |
          $ErrorActionPreference = 'Stop'

          $source = (Resolve-Path -LiteralPath $env:NX1_ROOT).Path.TrimEnd('\')
          $destination = Join-Path $env:GITHUB_WORKSPACE 'nx1'
          $workspaceRoot = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\')
          if ($source.Equals($workspaceRoot, [StringComparison]::OrdinalIgnoreCase) -or
              $source.StartsWith($workspaceRoot + '\', [StringComparison]::OrdinalIgnoreCase)) {
            throw 'NX1_ROOT must be outside the runner workspace.'
          }

          if (-not (Test-Path -LiteralPath $source -PathType Container)) {
            throw "NX1 input directory does not exist: $source"
          }

          foreach ($name in @('1-nx1sp.xex', '5-nx1mp_demo.xex')) {
            $file = Join-Path $source $name

            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing required input: $file"
            }
          }

          if (Test-Path -LiteralPath $destination) {
            Remove-Item -LiteralPath $destination -Recurse -Force
          }

          New-Item -ItemType Directory -Path $destination -Force | Out-Null

          # Current manifests need only these XEX inputs for code generation.
          foreach ($name in @('1-nx1sp.xex', '5-nx1mp_demo.xex')) {
            Copy-Item -LiteralPath (Join-Path $source $name) -Destination $destination -Force
          }

          Write-Host "NX1 codegen inputs staged from: $source"
          Get-ChildItem -LiteralPath $destination -Filter '*.xex' -File |
            Select-Object Name, Length

      - name: Checkout XenosRecomp Dependencies
        uses: actions/checkout@v4
        with:
          repository: hedge-dev/XenosRecomp
          ref: 990d03b28a27b50277ee5d8d942e1c5f873869d1
          path: .ci/TempXenos
          submodules: recursive
          persist-credentials: false

      - name: Restore XenosRecomp Thirdparty
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Join-Path $env:GITHUB_WORKSPACE '.ci\TempXenos\thirdparty'
          $destination = Join-Path $env:GITHUB_WORKSPACE 'XenosRecomp\thirdparty'

          if (-not (Test-Path -LiteralPath "$source\CMakeLists.txt" -PathType Leaf)) {
            throw 'XenosRecomp thirdparty checkout is incomplete.'
          }

          if (Test-Path -LiteralPath $destination) {
            Remove-Item -LiteralPath $destination -Recurse -Force
          }

          # 必须先创建目标目录，再复制其中的内容。
          New-Item -ItemType Directory -Path $destination -Force | Out-Null

          Get-ChildItem -LiteralPath $source -Force |
            Copy-Item -Destination $destination -Recurse -Force

          $required = @(
            'CMakeLists.txt',
            'fmt\CMakeLists.txt',
            'xxHash\cmake_unofficial\CMakeLists.txt',
            'zstd\build\cmake\CMakeLists.txt',
            'smol-v\source\smolv.cpp',
            'dxc-bin\CMakeLists.txt'
          )

          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path $destination $file) -PathType Leaf)) {
              throw "Dependency copy is incomplete: $file"
            }
          }

          Write-Host 'XenosRecomp thirdparty restored successfully.'

      - name: Set Up MSVC and Windows SDK
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install or Reuse LLVM 20.1.8 Locally
        run: |
          $ErrorActionPreference = 'Stop'
          $llvm = 'C:\NX1-tools\LLVM-20.1.8'
          $compiler = Join-Path $llvm 'bin\clang++.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            New-Item -ItemType Directory -Path 'C:\NX1-tools' -Force | Out-Null
            $installer = 'C:\NX1-tools\LLVM-20.1.8-win64.exe'
            & curl.exe --fail --location --silent --show-error --retry 3 --connect-timeout 20 --max-time 1800 --proxy socks5h://192.168.5.2:10810 --output $installer https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/LLVM-20.1.8-win64.exe
            if ($LASTEXITCODE -ne 0) { throw 'LLVM download failed.' }
            if ((Get-FileHash -LiteralPath $installer).Hash -ine '3197846a2b19063687dd56e93e34cd941e3548d907f23a6131571321bdf9fe7b') {
              throw 'LLVM installer SHA256 mismatch.'
            }
            $install = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$llvm") -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "LLVM install failed: $($install.ExitCode)" }
          }
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'LLVM compiler was not installed.' }
          & $compiler --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "LLVM_PATH=$llvm" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Locate CMake and Ninja
        run: |
          $ErrorActionPreference = 'Stop'
          $cmakeTools = Join-Path $env:VSINSTALLDIR 'Common7\IDE\CommonExtensions\Microsoft\CMake'
          foreach ($relative in @('CMake\bin', 'Ninja')) {
            $toolDir = Join-Path $cmakeTools $relative
            if (-not (Test-Path -LiteralPath $toolDir -PathType Container)) {
              throw "Missing VS CMake/Ninja tools: $toolDir"
            }
            $toolDir | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Set Compiler Environment
        run: |
          $ErrorActionPreference = 'Stop'

          $cc = Join-Path $env:LLVM_PATH 'bin\clang.exe'
          $cxx = Join-Path $env:LLVM_PATH 'bin\clang++.exe'

          if (-not (Test-Path -LiteralPath $cc -PathType Leaf)) {
            throw "clang.exe was not found: $cc"
          }

          if (-not (Test-Path -LiteralPath $cxx -PathType Leaf)) {
            throw "clang++.exe was not found: $cxx"
          }

          "CC=$cc" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CXX=$cxx" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

          & $cxx --version
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          cmake --version
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          ninja --version
          if ($LASTEXITCODE -ne 0) {
            throw 'ninja was not found. Install Ninja or Visual Studio CMake/Ninja tools on the runner.'
          }

      - name: Configure XenosRecomp
        run: |
          cmake --fresh `
            -S XenosRecomp `
            -B XenosRecomp/build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_C_COMPILER=$env:CC" `
            "-DCMAKE_CXX_COMPILER=$env:CXX" `
            -DCMAKE_C_COMPILER_TARGET=x86_64-pc-windows-msvc `
            -DCMAKE_CXX_COMPILER_TARGET=x86_64-pc-windows-msvc

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build XenosRecomp
        run: |
          cmake --build XenosRecomp/build `
            --target XenosRecomp `
            --parallel 2

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Checkout ReXGlue Dependency Source
        uses: actions/checkout@v4
        with:
          repository: rexglue/rexglue-sdk
          ref: e8ce24fa73cd7c1ede80262c06f34893b7963dbe
          path: .ci/TempRex
          submodules: recursive
          persist-credentials: false

      - name: Restore ReXGlue Thirdparty Into Local Fork
        run: |
          $ErrorActionPreference = 'Stop'

          $source = Join-Path $env:GITHUB_WORKSPACE '.ci\TempRex\thirdparty'
          $destination = Join-Path $env:GITHUB_WORKSPACE 'rexglue-sdk\thirdparty'

          if (-not (Test-Path -LiteralPath "$source\CMakeLists.txt" -PathType Leaf)) {
            throw 'ReXGlue thirdparty checkout is incomplete.'
          }

          if (Test-Path -LiteralPath $destination) {
            Remove-Item -LiteralPath $destination -Recurse -Force
          }

          New-Item -ItemType Directory -Path $destination -Force | Out-Null

          Copy-Item `
            -Path (Join-Path $source '*') `
            -Destination $destination `
            -Recurse `
            -Force

          $required = @(
            'cli11',
            'libmspack',
            'FFmpeg',
            'tomlplusplus',
            'simde',
            'xxHash',
            'spdlog',
            'fmt',
            'snappy',
            'utfcpp',
            'imgui',
            'sdl3'
          )

          foreach ($name in $required) {
            $sourceSubmodule = Join-Path $source $name
            $destinationSubmodule = Join-Path $destination $name

            if (-not (Test-Path -LiteralPath $sourceSubmodule -PathType Container)) {
              throw "Missing ReXGlue submodule source: $name"
            }

            if (-not (Test-Path -LiteralPath $destinationSubmodule -PathType Container)) {
              throw "Failed to copy ReXGlue submodule: $name"
            }

            $gitDir = (& git -C $sourceSubmodule rev-parse --absolute-git-dir 2>$null | Out-String).Trim()

            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($gitDir)) {
              throw "Could not resolve Git directory for submodule: $name"
            }

            $marker = Join-Path $destinationSubmodule '.git'

            if (Test-Path -LiteralPath $marker) {
              Remove-Item -LiteralPath $marker -Recurse -Force
            }

            Set-Content `
              -LiteralPath $marker `
              -Value ("gitdir: " + $gitDir.Replace('\', '/')) `
              -Encoding ascii
          }

          if (-not (Test-Path -LiteralPath "$destination\CMakeLists.txt" -PathType Leaf)) {
            throw 'ReXGlue thirdparty restoration failed.'
          }

          if (-not (Test-Path -LiteralPath "$destination\cli11\.git" -PathType Leaf)) {
            throw 'ReXGlue submodule marker restoration failed.'
          }

      - name: Configure ReXGlue Code Generator
        run: |
          cmake --fresh `
            -S rexglue-sdk `
            -B rexglue-sdk/build-codegen `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_C_COMPILER=$env:CC" `
            "-DCMAKE_CXX_COMPILER=$env:CXX" `
            -DCMAKE_C_COMPILER_TARGET=x86_64-pc-windows-msvc `
            -DCMAKE_CXX_COMPILER_TARGET=x86_64-pc-windows-msvc `
            -DREXGLUE_BUILD_TESTS=OFF `
            -DREXGLUE_ENABLE_TRACY=OFF `
            -DREXGLUE_ENABLE_DISCORD_SOCIAL_SDK=OFF `
            -DREXGLUE_USE_VULKAN=OFF `
            -DREXGLUE_USE_D3D12=ON

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build ReXGlue Code Generator
        run: |
          cmake --build rexglue-sdk/build-codegen `
            --target rexglue `
            --parallel 2

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $rexglue = Join-Path $env:GITHUB_WORKSPACE 'rexglue-sdk\out\win-amd64\rexglue.exe'

          if (-not (Test-Path -LiteralPath $rexglue -PathType Leaf)) {
            throw "ReXGlue executable was not produced: $rexglue"
          }

      - name: Generate Singleplayer and Multiplayer Code
        run: |
          $ErrorActionPreference = 'Stop'

          $rexglue = Join-Path $env:GITHUB_WORKSPACE 'rexglue-sdk\out\win-amd64\rexglue.exe'

          if (-not (Test-Path -LiteralPath $rexglue -PathType Leaf)) {
            throw "ReXGlue executable not found: $rexglue"
          }

          & $rexglue -f codegen nx1_sp/nx1_sp_manifest.toml
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          & $rexglue -f codegen nx1_mp/nx1_mp_manifest.toml
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Check Generated Sources
        run: |
          $required = @(
            'nx1_sp/generated/rexglue.cmake',
            'nx1_sp/generated/1-nx1sp/sources.cmake',
            'nx1_mp/generated/rexglue.cmake',
            'nx1_mp/generated/5-nx1mp_demo/sources.cmake'
          )

          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing generated file: $file"
            }
          }

      - name: Configure Singleplayer
        run: |
          cmake --fresh `
            -S nx1_sp `
            -B nx1_sp/build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DREXSDK_DIR=$env:GITHUB_WORKSPACE/rexglue-sdk" `
            "-DCMAKE_C_COMPILER=$env:CC" `
            "-DCMAKE_CXX_COMPILER=$env:CXX" `
            -DCMAKE_C_COMPILER_TARGET=x86_64-pc-windows-msvc `
            -DCMAKE_CXX_COMPILER_TARGET=x86_64-pc-windows-msvc `
            -DREXGLUE_ENABLE_TRACY=OFF `
            -DREXGLUE_ENABLE_DISCORD_SOCIAL_SDK=OFF `
            -DREXGLUE_USE_VULKAN=OFF `
            -DREXGLUE_USE_D3D12=ON

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build Singleplayer
        run: |
          cmake --build nx1_sp/build `
            --target nx1_sp `
            --parallel 2

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Configure Multiplayer
        run: |
          cmake --fresh `
            -S nx1_mp `
            -B nx1_mp/build `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DREXSDK_DIR=$env:GITHUB_WORKSPACE/rexglue-sdk" `
            "-DCMAKE_C_COMPILER=$env:CC" `
            "-DCMAKE_CXX_COMPILER=$env:CXX" `
            -DCMAKE_C_COMPILER_TARGET=x86_64-pc-windows-msvc `
            -DCMAKE_CXX_COMPILER_TARGET=x86_64-pc-windows-msvc `
            -DREXGLUE_ENABLE_TRACY=OFF `
            -DREXGLUE_ENABLE_DISCORD_SOCIAL_SDK=OFF `
            -DREXGLUE_USE_VULKAN=OFF `
            -DREXGLUE_USE_D3D12=ON

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build Multiplayer
        run: |
          cmake --build nx1_mp/build `
            --target nx1_mp `
            --parallel 2

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Verify Local Build Outputs
        run: |
          $searchRoots = @(
            'XenosRecomp',
            'nx1_sp',
            'nx1_mp',
            'rexglue-sdk\out'
          )

          $executables = @()

          foreach ($root in $searchRoots) {
            if (Test-Path -LiteralPath $root) {
              $executables += Get-ChildItem `
                -LiteralPath $root `
                -Recurse `
                -File `
                -Filter '*.exe' `
                -ErrorAction SilentlyContinue
            }
          }

          $executables |
            Sort-Object FullName -Unique |
            Select-Object FullName, Length |
            Format-Table -AutoSize

          $sp = $executables | Where-Object { $_.Name -eq 'nx1_sp.exe' }
          $mp = $executables | Where-Object { $_.Name -eq 'nx1_mp.exe' }

          if (-not $sp) {
            throw 'nx1_sp.exe was not produced.'
          }

          if (-not $mp) {
            throw 'nx1_mp.exe was not produced.'
          }

          Write-Host "Singleplayer executable: $($sp.FullName)"
          Write-Host "Multiplayer executable: $($mp.FullName)"

          # Preserve binaries locally outside checkout, which is cleaned on the next run.
          $outputRoot = Join-Path 'C:\NX1-output' ("run-{0}-attempt-{1}" -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT)
          foreach ($target in @('XenosRecomp', 'rexglue', 'nx1_sp', 'nx1_mp')) {
            $binary = $executables | Where-Object { $_.Name -eq "$target.exe" } | Select-Object -First 1
            if (-not $binary) { throw "Missing output executable: $target.exe" }
            $outputDir = Join-Path $outputRoot $target
            New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
            Copy-Item -LiteralPath $binary.FullName -Destination $outputDir -Force
            Get-ChildItem -LiteralPath $binary.DirectoryName -Filter '*.dll' -File |
              Copy-Item -Destination $outputDir -Force
          }
          Write-Host "Binaries saved locally: $outputRoot"
